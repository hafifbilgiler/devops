kind: ConfigMap
apiVersion: v1
metadata:
  name: grafana-datasources
  namespace: namspacename
data:
  datasources.yaml: |-
    apiVersion: 1
    datasources:
    - name: name_of_datasoruce
      type: prometheus
      url: https://thanos-querier-openshift-monitoring.apps.clustername.yourdomain
      access: proxy
      jsonData:
        httpHeaderName1: "Authorization"
        tlsSkipVerify: true
      secureJsonData:
        httpHeaderValue1: "Bearer sa_token"